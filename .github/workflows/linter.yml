on: [pull_request]

jobs:
  linter:
    runs-on: ubuntu-latest
    name: Lint flutter code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - run: flutter pub get
      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@ee4edfd77e05583da3805e6cfbcf8f06c4f4bbb4
        with:
          fail-on: "info"
          severity-override: |
            deprecated_member_use_from_same_package: note
            unused_local_variable: info
