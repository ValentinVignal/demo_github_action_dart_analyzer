on: [pull_request]

jobs:
  linter:
    runs-on: ubuntu-latest
    name: Lint flutter code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - run: flutter pub get
      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@69e4eaed77dfc7d24bc2f28f2f1cb6da95716112
        with:
          fail-on-format: false
          severity-overrides: |
            deprecated_member_use_from_same_package: note
            unused_local_variable: info
