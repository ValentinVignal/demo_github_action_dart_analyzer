on: [pull_request]

jobs:
  linter:
    runs-on: ubuntu-latest
    name: Lint flutter code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - run: flutter pub get
      - name: Analyze Flutter
        uses: GP4ck/action-dart-analyze@9098ae474acc6f48fc4b8c8f6c6502a3642ad2e7
        with:
          fail-on-format: false
          severity-overrides: |
            deprecated_member_use_from_same_package: note
            unused_local_variable: info
